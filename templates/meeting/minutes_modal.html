<div class="fixed inset-0 z-50 bg-gray-900/50 flex items-start justify-center p-4 overflow-y-auto">
  <div class="bg-white border border-gray-200 rounded-xl shadow-2xl w-full max-w-2xl mt-10">
    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">
      <div>
        <h2 class="font-semibold text-gray-900">📝 Minutes — {{ block.title }}</h2>
        <p class="text-xs text-gray-500">
          {{ block.date|date:"l j F Y" }} · {{ block.start_time|time:"H:i" }}–{{ block.end_time|time:"H:i" }}
        </p>
      </div>
      <button type="button"
              onclick="document.getElementById('modal-root').innerHTML = ''"
              class="text-gray-400 hover:text-gray-600 text-2xl leading-none w-8 h-8 flex items-center justify-center">×</button>
    </div>

    <form hx-post="{% url 'meeting-notes' block_pk=block.pk %}"
          hx-target="#modal-root"
          hx-swap="innerHTML"
          class="p-5 space-y-5">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="{{ form.minutes.id_for_label }}">Minutes / notes</label>
        <textarea name="{{ form.minutes.html_name }}" id="{{ form.minutes.id_for_label }}" rows="16"
                  placeholder="Discussion, decisions, action items…"
                  class="form-input w-full text-sm">{{ form.minutes.value|default_if_none:"" }}</textarea>
      </div>

      {% if form.errors %}
      <div class="text-xs text-red-600">Please fix the errors above.</div>
      {% endif %}

      <div class="flex justify-end gap-2 pt-2 border-t border-gray-100">
        <button type="button" onclick="document.getElementById('modal-root').innerHTML = ''" class="btn-outline text-sm">Cancel</button>
        <button type="submit" class="btn-indigo text-sm">Save minutes</button>
      </div>
    </form>
  </div>
</div>
